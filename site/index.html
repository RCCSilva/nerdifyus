    <!-- We ship our own translations; stop browsers from machine-translating on top of them. -->
    <meta name="google" content="notranslate" />
    <script>
      // Set <html lang> from the URL before React loads, so browsers detect the right language.
      var m = location.hash.match(/^#\/([A-Za-z-]+)/);
      if (m) document.documentElement.lang = m[1];
    </script>
